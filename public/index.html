<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cari Lokasi</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #ffffff;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        background:
          radial-gradient(circle at 20% 15%, #2a2a2a 0%, transparent 45%),
          radial-gradient(circle at 85% 85%, #1e1e1e 0%, transparent 45%),
          #050505;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 26px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid #2c2c2c;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }
