<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cari Lokasi</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #ffffff;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        background:
          radial-gradient(circle at 20% 15%, #2a2a2a 0%, transparent 45%),
          radial-gradient(circle at 85% 85%, #1e1e1e 0%, transparent 45%),
          #050505;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 26px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid #2c2c2c;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      
      /* Identitas */
      .identitas {
        padding-bottom: 18px;
        margin-bottom: 20px;
        border-bottom: 1px solid #2c2c2c;
      }

      .identitas .nama {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .identitas .nim {
        margin: 3px 0 0;
        font-size: 13px;
        color: #8a8a8a;
        letter-spacing: 0.5px;
      }

      /* Judul */
      h2 {
        margin: 0 0 4px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: #8a8a8a;
      }

      /* Form */
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #b5b5b5;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .form {
        display: flex;
        gap: 8px;
        margin-bottom: 22px;
      }

      .kolom {
        position: relative;
        flex: 1;
      }

      .kolom svg {
        position: absolute;
        top: 50%;
        left: 13px;
        width: 16px;
        height: 16px;
        transform: translateY(-50%);
        stroke: #777777;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
      }

      
      input {
        width: 100%;
        padding: 12px 12px 12px 38px;
        font-size: 14px;
        font-family: inherit;
        color: #ffffff;
        background: #0a0a0a;
        border: 1px solid #333333;
        border-radius: 12px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input::placeholder {
        color: #666666;
      }

      input:focus {
        border-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
      }

      button {
        padding: 0 20px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        color: #000000;
        background: #ffffff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition:
          transform 0.15s,
          background 0.2s;
      }

      button:hover {
        background: #dcdcdc;
      }

      button:active {
        transform: scale(0.96);
      }

      /* Hasil */
      .hasil {
        transition: opacity 0.25s;
      }

      .hasil.loading {
        opacity: 0.35;
      }
