<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cari Lokasi</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #ffffff;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        background:
          radial-gradient(circle at 20% 15%, #2a2a2a 0%, transparent 45%),
          radial-gradient(circle at 85% 85%, #1e1e1e 0%, transparent 45%),
          #050505;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 26px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid #2c2c2c;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      }

      /* Identitas */
      .identitas {
        padding-bottom: 18px;
        margin-bottom: 20px;
        border-bottom: 1px solid #2c2c2c;
      }

      .identitas .nama {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .identitas .nim {
        margin: 3px 0 0;
        font-size: 13px;
        color: #8a8a8a;
        letter-spacing: 0.5px;
      }

      /* Judul */
      h2 {
        margin: 0 0 4px;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .sub {
        margin: 0 0 20px;
        font-size: 13px;
        color: #8a8a8a;
      }

      /* Form */
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 600;
        color: #b5b5b5;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .form {
        display: flex;
        gap: 8px;
        margin-bottom: 22px;
      }

      .kolom {
        position: relative;
        flex: 1;
      }

      .kolom svg {
        position: absolute;
        top: 50%;
        left: 13px;
        width: 16px;
        height: 16px;
        transform: translateY(-50%);
        stroke: #777777;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
      }

      input {
        width: 100%;
        padding: 12px 12px 12px 38px;
        font-size: 14px;
        font-family: inherit;
        color: #ffffff;
        background: #0a0a0a;
        border: 1px solid #333333;
        border-radius: 12px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input::placeholder {
        color: #666666;
      }

      input:focus {
        border-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12);
      }

      button {
        padding: 0 20px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        color: #000000;
        background: #ffffff;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition:
          transform 0.15s,
          background 0.2s;
      }

      button:hover {
        background: #dcdcdc;
      }

      button:active {
        transform: scale(0.96);
      }

      /* Hasil */
      .hasil {
        transition: opacity 0.25s;
      }

      .hasil.loading {
        opacity: 0.35;
      }

      .baris {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        margin-bottom: 8px;
        font-size: 14px;
        background: #0d0d0d;
        border: 1px solid #262626;
        border-radius: 12px;
        transition: border-color 0.2s;
      }

      .baris:hover {
        border-color: #555555;
      }

      .baris .k {
        color: #8a8a8a;
      }

      .baris .v {
        font-weight: 600;
        text-align: right;
      }

      .koordinat {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .kotak {
        padding: 14px;
        background: #0d0d0d;
        border: 1px solid #262626;
        border-radius: 12px;
        transition: border-color 0.2s;
      }

      .kotak:hover {
        border-color: #555555;
      }

      .kotak .k {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
        font-weight: 600;
        color: #8a8a8a;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .kotak .v {
        display: block;
        font-size: 16px;
        font-weight: 700;
        word-break: break-all;
      }

      /* Pesan */
      .pesan {
        min-height: 34px;
        margin: 16px 0 0;
        padding: 8px 12px;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
        color: #b5b5b5;
        background: #0d0d0d;
        border: 1px dashed #333333;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="identitas">
        <p class="nama">Bima Baraja</p>
        <p class="nim">NIM 20240140015</p>
      </div>

      <h2>Cari Lokasi</h2>
      <p class="sub">Data dari MapTiler Geocoding API</p>

      <form id="form-cari">
        <label for="input-lokasi">Lokasi</label>
        <div class="form">
          <div class="kolom">
            <svg viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.5" y2="16.5"></line>
            </svg>
            <input
              type="text"
              id="input-lokasi"
              placeholder="Contoh: Bandung"
              value="Bandung"
              autocomplete="off"
            />
          </div>
          <button type="submit">Cari</button>
        </div>
      </form>

      <div class="hasil" id="hasil">
        <div class="baris">
          <span class="k">Negara</span>
          <span class="v" id="negara">-</span>
        </div>
        <div class="baris">
          <span class="k">Provinsi</span>
          <span class="v" id="provinsi">-</span>
        </div>
        <div class="baris">
          <span class="k">Kecamatan</span>
          <span class="v" id="kecamatan">-</span>
        </div>

        <div class="koordinat">
          <div class="kotak">
            <span class="k">Longitude</span>
            <span class="v" id="longitude">-</span>
          </div>
          <div class="kotak">
            <span class="k">Latitude</span>
            <span class="v" id="latitude">-</span>
          </div>
        </div>
      </div>

      <p class="pesan" id="pesan"></p>
    </div>

    <script>
      const form = document.getElementById("form-cari");
      const inputLokasi = document.getElementById("input-lokasi");
      const pesan = document.getElementById("pesan");
      const hasil = document.getElementById("hasil");

      function isiHasil(negara, provinsi, kecamatan, longitude, latitude) {
        document.getElementById("negara").textContent = negara;
        document.getElementById("provinsi").textContent = provinsi;
        document.getElementById("kecamatan").textContent = kecamatan;
        document.getElementById("longitude").textContent = longitude;
        document.getElementById("latitude").textContent = latitude;
      }

      async function cariLokasi(lokasi) {
        pesan.textContent = "";

        if (!lokasi.trim()) {
          isiHasil("-", "-", "-", "-", "-");
          pesan.textContent = "Lokasi wajib diisi";
          return;
        }

        pesan.textContent = "Mencari...";
        hasil.classList.add("loading");

        try {
          const response = await fetch(
            "/api/lokasi?kota=" + encodeURIComponent(lokasi.trim()),
          );
          const data = await response.json();

          if (!response.ok) {
            isiHasil("-", "-", "-", "-", "-");
            pesan.textContent = data.message;
            return;
          }

          console.log(data);
          isiHasil(
            data.negara,
            data.provinsi,
            data.kecamatan,
            data.longitude,
            data.latitude,
          );
          pesan.textContent = data.lokasi;
        } catch (error) {
          console.error(error);
          isiHasil("-", "-", "-", "-", "-");
          pesan.textContent = "Terjadi kesalahan saat mengambil data";
        } finally {
          hasil.classList.remove("loading");
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        cariLokasi(inputLokasi.value);
      });

      cariLokasi(inputLokasi.value);
    </script>
  </body>
</html>
